name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML and Python
        run: |
          python3 -c "import glob, xml.dom.minidom as m; [m.parse(f) for f in glob.glob('src/*.xcu') + glob.glob('src/*.xml')]"
          python3 -m py_compile src/copilot/*.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build .oxt
        run: ./build.sh

      - name: Checksums
        run: sha256sum dist/*.oxt > dist/SHA256SUMS && cat dist/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaiLPER-oxt
          path: |
            dist/*.oxt
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.oxt
            dist/SHA256SUMS

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice and python-uno
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-uno

      - name: Start headless LibreOffice
        run: |
          soffice --headless --invisible --norestore --nologo --nodefault \
            -env:UserInstallation=file:///tmp/lo-test \
            --accept="socket,host=127.0.0.1,port=2002;urp;" &
          for i in $(seq 1 60); do
            ss -ltn 2>/dev/null | grep -q 2002 && break
            sleep 2
          done
          ss -ltn 2>/dev/null | grep -q 2002

      - name: Run integration tests
        env:
          HAILPER_TEST_PORT: "2002"
        run: python3 -m unittest discover -s tests -p 'test_integration.py' -v
